openapi: 3.0.3
info:
  title: Data Fabric API
  description: |
    HTTP API for managing configured data sources and executing read-only batch queries.
    SQL execution uses POST /fetch. The /query routes validate SQL and expose query
    statistics and per-user history. Driver support is described in the repository
    documentation and is not inferred from registry names alone.
  version: 1.2.0
  contact:
    name: RhinoLink Tech
    url: https://github.com/RhinoLink-Tech/data-fabric/discussions
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080/api/v1
    description: Local server using the default configuration

tags:
  - name: Health
    description: Health check endpoints
  - name: DataSources
    description: Data source management endpoints
  - name: Queries
    description: Query execution endpoints
  - name: Databases
    description: Database connection test endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Get gateway health status
      description: Returns the health status of the gateway and connectivity to configured data sources
      operationId: getHealth
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /datasources:
    get:
      tags:
        - DataSources
      summary: List all data sources
      description: Retrieves a paginated list of all configured data sources with optional filtering by type and status
      operationId: listDataSources
      parameters:
        - name: type
          in: query
          description: Filter by a type currently registered in the runtime driver registry
          schema:
            $ref: '#/components/schemas/DataSourceType'
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive, error]
        - name: page
          in: query
          description: Page number (starting from 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcesListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - DataSources
      summary: Create a new data source
      description: Creates a new data source configuration with the specified type and connection parameters
      operationId: createDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceCreateRequest'
      responses:
        '201':
          description: Data source created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Data source name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasources/{id}:
    get:
      tags:
        - DataSources
      summary: Get data source details
      description: Retrieves detailed information about a specific data source
      operationId: getDataSource
      parameters:
        - name: id
          in: path
          required: true
          description: Data source UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - DataSources
      summary: Update data source configuration
      description: Updates the configuration of an existing data source
      operationId: updateDataSource
      parameters:
        - name: id
          in: path
          required: true
          description: Data source UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceUpdateRequest'
      responses:
        '200':
          description: Data source updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - DataSources
      summary: Delete a data source
      description: Deletes a data source configuration
      operationId: deleteDataSource
      parameters:
        - name: id
          in: path
          required: true
          description: Data source UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Data source deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /datasources/{id}/test:
    post:
      tags:
        - DataSources
      summary: Test data source connection
      description: Tests the connectivity to a data source without executing a query
      operationId: testDataSourceConnection
      parameters:
        - name: id
          in: path
          required: true
          description: Data source UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connection test successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Connection test failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResponse'

  /fetch:
    post:
      tags:
        - Queries
      summary: Execute read-only SQL and return the first batch
      description: >-
        Executes one read-only SELECT statement against an authorized data source.
        The response reports the actual execution mode and includes a continuation
        URI when a query session has more rows.
      operationId: fetchQuery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchQueryRequest'
      responses:
        '200':
          description: First result batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchQueryResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller cannot read the data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request fields failed validation, or the statement cannot be counted exactly (COUNT_UNSUPPORTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Query execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fetch/{query_id}/{slug}/{token}:
    get:
      tags:
        - Queries
      summary: Fetch the next query batch
      description: >-
        Retrieves a continuation batch for a session created by POST /fetch.
        Session state is process-local and is lost on restart.
      operationId: fetchNextBatch
      security:
        - BearerAuth: []
      parameters:
        - name: query_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: batch_size
          in: query
          required: false
          description: Requested size of this continuation batch
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10000
      responses:
        '200':
          description: Next result batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchQueryResponse'
        '400':
          description: Invalid path or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not own the query session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found, expired, or lost after restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Continuation fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /query/validate:
    post:
      tags:
        - Queries
      summary: Validate a SQL statement
      description: Validates the SQL and data-source access without executing the statement.
      operationId: validateQuery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryValidateRequest'
      responses:
        '200':
          description: Validation result, including invalid SQL details in data when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryValidateResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller cannot read the data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request fields failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /query/stats:
    get:
      tags:
        - Queries
      summary: Get query statistics
      operationId: getQueryStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Query statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStatsResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Statistics could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /query/history:
    get:
      tags:
        - Queries
      summary: Get the caller's recent query history
      operationId: getQueryHistory
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records, default 100 and maximum 1000
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: dataSourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recent records scoped to the authenticated caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryHistoryResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Query history could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /databases/test/{id}:
    get:
      tags:
        - Databases
      summary: Test database connection
      description: "**DEPRECATED** - Use POST /datasources/{id}/test instead"
      deprecated: true
      operationId: testDatabase
      parameters:
        - name: id
          in: path
          required: true
          description: Data source UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DataSourceType:
      type: string
      enum:
        # Relational and domestic databases
        - mysql
        - mariadb
        - postgresql
        - oracle
        - sqlserver
        - dameng
        - oceanbase_mysql
        - oceanbase_oracle
        - tidb
        - tdsql
        - gaussdb_mysql
        - gaussdb_postgres
        - kingbasees
        - gbase_8s
        - gbase_8t
        - oscar
        - opengauss
        # Warehouses and query engines
        - snowflake
        - databricks
        - redshift
        - bigquery
        - hive
        - trino
        - presto
        - openlookeng
        - maxcompute
        # OLAP and NoSQL databases
        - clickhouse
        - doris
        - starrocks
        - druid
        - hologres
        - mongodb
        # Data lake table formats
        - iceberg
        - delta_lake
        - hudi
        # Object storage and file formats
        - azure_blob_parquet
        - azure_delta
        - azure_parquet
        - cos_parquet
        - minio_csv
        - minio_delta
        - minio_iceberg
        - minio_parquet
        - oss_delta
        - oss_parquet
        - s3_parquet
        - s3_orc
        - s3_avro
        - s3_csv
        - s3_json
        # Distributed file systems
        - hdfs_avro
        - hdfs_parquet
        - hdfs_csv
        - hdfs_text
        - hdfs_parquet_compressed
      description: Data source types with a driver registered in the current runtime

    DataSourceStatus:
      type: string
      enum: [active, inactive, error]
      description: Data source connection status

    DataSourceConfig:
      type: object
      description: Data source connection configuration (extensible per source type)
      properties:
        host:
          type: string
          description: Server hostname or IP address
          example: localhost
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Server port number
          example: 3306
        database:
          type: string
          description: Database name
          example: mydb
        username:
          type: string
          description: Database username
          example: readonly_user
        password:
          type: string
          format: password
          description: Database password (encrypted in storage)
          example: "********"
        ssl:
          type: boolean
          description: Enable SSL/TLS connection
          default: false
        timeout:
          type: integer
          description: Connection timeout in seconds
          default: 30
        maxPoolSize:
          type: integer
          description: Maximum connection pool size
          default: 10
        idleTimeout:
          type: integer
          description: Idle connection timeout in seconds
          default: 600
        maxLifetime:
          type: integer
          description: Maximum connection lifetime in seconds
          default: 1800
        timezone:
          type: string
          description: Database timezone
          example: UTC
        authentication:
          type: object
          description: Authentication configuration (for cloud services)
          properties:
            type:
              type: string
              enum: [basic, oauth2, iam, kerberos, jwt, sas, pat, keypair]
              description: Authentication type
            credentials:
              type: object
              description: Authentication credentials (encrypted in storage)
        additionalProps:
          type: object
          additionalProperties: true
          description: Additional source-specific properties

    DataSourceCreateRequest:
      type: object
      required:
        - name
        - type
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Data source name (must be unique)
          example: Production MySQL
        type:
          $ref: '#/components/schemas/DataSourceType'
        config:
          $ref: '#/components/schemas/DataSourceConfig'

    DataSourceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Data source name
        config:
          $ref: '#/components/schemas/DataSourceConfig'
        status:
          $ref: '#/components/schemas/DataSourceStatus'

    DataSource:
      type: object
      required:
        - id
        - name
        - type
        - config
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Data source UUID
        name:
          type: string
          description: Data source name
        type:
          $ref: '#/components/schemas/DataSourceType'
        config:
          $ref: '#/components/schemas/DataSourceConfig'
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    DataSourceResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DataSource'
        correlationId:
          type: string
          format: uuid
          description: Correlation ID for request tracing

    DataSourcesListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - dataSources
            - pagination
          properties:
            dataSources:
              type: array
              items:
                $ref: '#/components/schemas/DataSource'
            pagination:
              type: object
              required:
                - page
                - limit
                - total
                - totalPages
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 20
                total:
                  type: integer
                  example: 45
                totalPages:
                  type: integer
                  example: 3

    FetchQueryRequest:
      type: object
      required:
        - dataSourceId
        - sql
      properties:
        dataSourceId:
          type: string
          format: uuid
          description: ID of a registered data source the caller can read
        sql:
          type: string
          description: One read-only SELECT statement in the target dialect
        parameters:
          type: array
          maxItems: 64
          description: >-
            Ordered values the SQL driver binds to ? or $1..$N placeholders;
            never interpolated into the SQL text
          items:
            nullable: true
            oneOf:
              - type: boolean
              - type: number
              - type: string
        sourceDialect:
          type: string
          description: Optional input dialect for supported SQL translation
          example: postgres
        type:
          type: integer
          enum: [1, 2]
          description: Omit for configured execution mode; 1 requests pagination and 2 requests streaming
        batch_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
          description: Maximum rows requested in the first result batch
        timeout:
          type: integer
          minimum: 1
          maximum: 1800
          default: 60
          description: Timeout in seconds for the initial request

    FetchQueryData:
      type: object
      required:
        - queryId
        - slug
        - token
        - executionMode
        - columns
        - entries
        - totalCount
      properties:
        queryId:
          type: string
          format: uuid
          description: Server-generated query-session ID
        slug:
          type: string
          description: Short session identifier
        token:
          type: string
          description: Per-session continuation token
        executionMode:
          type: string
          enum: [streaming, pagination]
          description: Execution path that handled this query
        nextUri:
          type: string
          description: Relative URI for the next batch; omitted when no continuation is available
        columns:
          type: array
          items:
            $ref: '#/components/schemas/QueryColumn'
        entries:
          type: array
          description: Result rows, with each row ordered to match columns
          items:
            type: array
            items: {}
        totalCount:
          type: integer
          format: int64
          description: Count reported for the submitted SQL

    FetchQueryResponse:
      type: object
      required:
        - success
        - data
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/FetchQueryData'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    QueryValidateRequest:
      type: object
      required:
        - dataSourceId
        - sql
      properties:
        dataSourceId:
          type: string
          format: uuid
          description: Data source to validate access against
        sql:
          type: string
          description: Read-only SQL statement to validate; it is not executed
        sourceDialect:
          type: string
          description: Optional input dialect for supported SQL validation and translation
        parameters:
          type: array
          description: Accepted by the validation request model; values are not bound or executed
          items: {}
        limit:
          type: integer
          minimum: 1
          maximum: 10000
        offset:
          type: integer
          minimum: 0
        timeout:
          type: integer
          minimum: 1
          maximum: 300

    QueryValidationData:
      type: object
      required:
        - valid
        - queryId
      properties:
        valid:
          type: boolean
        queryId:
          type: string
          format: uuid
        error:
          type: string
          description: Safe validation error message when valid is false

    QueryValidateResponse:
      type: object
      required:
        - success
        - data
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/QueryValidationData'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    QueryColumn:
      type: object
      required:
        - name
        - type
        - nullable
      properties:
        name:
          type: string
          example: order_id
        type:
          type: string
          description: Normalized result type
          example: integer
        nullable:
          type: boolean
          example: false
        nestedFields:
          type: array
          items:
            $ref: '#/components/schemas/QueryColumn'

    QueryStatsData:
      type: object
      required:
        - totalQueries
        - successfulQueries
        - failedQueries
        - avgExecutionTime
        - lastQueryTime
        - queriesByType
      properties:
        totalQueries:
          type: integer
          format: int64
        successfulQueries:
          type: integer
          format: int64
        failedQueries:
          type: integer
          format: int64
        avgExecutionTime:
          type: number
          format: double
          description: Average query execution time in seconds
        lastQueryTime:
          type: string
          format: date-time
        queriesByType:
          type: object
          additionalProperties:
            type: integer
            format: int64

    QueryStatsResponse:
      type: object
      required:
        - success
        - data
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/QueryStatsData'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    QueryRecord:
      type: object
      required:
        - queryId
        - dataSourceId
        - status
        - durationMs
        - user
        - executedAt
      properties:
        queryId:
          type: string
          format: uuid
        dataSourceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [success, error]
        durationMs:
          type: integer
          format: int64
        user:
          type: string
        executedAt:
          type: string
          format: date-time

    QueryHistoryData:
      type: object
      required:
        - queries
        - total
        - limit
        - offset
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/QueryRecord'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    QueryHistoryResponse:
      type: object
      required:
        - success
        - data
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/QueryHistoryData'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    StandardResponse:
      type: object
      required:
        - success
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorInfo'
        message:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string

    ConnectionTestResponse:
      type: object
      required:
        - success
        - data
        - correlationId
      properties:
        success:
          type: boolean
          description: Whether the connection test succeeded
          example: true
        data:
          type: object
          required:
            - connected
            - message
            - testedAt
          properties:
            connected:
              type: boolean
              description: Connection status
              example: true
            message:
              type: string
              description: Test result message
              example: Successfully connected to data source
            executionTimeMs:
              type: integer
              description: Connection test duration in milliseconds
              example: 23
            testedAt:
              type: string
              format: date-time
              description: Test timestamp
        correlationId:
          type: string
          format: uuid

    HealthResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - status
            - version
            - timestamp
          properties:
            status:
              type: string
              enum: [healthy, degraded, unhealthy]
              description: Gateway health status
            version:
              type: string
              description: Gateway version
              example: 1.1.0
            timestamp:
              type: string
              format: date-time
              description: Health check timestamp
            activeDataSources:
              type: integer
              description: Number of active data sources
              example: 12
            totalDataSources:
              type: integer
              description: Total number of configured data sources
              example: 15

    ErrorResponse:
      type: object
      required:
        - success
        - error
        - correlationId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorInfo'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token obtained from login endpoint

security:
  - BearerAuth: []
