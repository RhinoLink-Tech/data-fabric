name: Experimental SQLite metadata

on:
  pull_request:
    paths:
      - 'Dockerfile.sqlite'
      - '.dockerignore'
      - 'deploy/sqlite/**'
      - 'scripts/sqlite/**'
      - 'scripts/mcp/onboard.py'
      - 'cmd/server/sqlite_compose*.go'
      - 'internal/config/**'
      - 'internal/model/datasource.go'
      - 'cmd/server/sqlite_snapshot*.go'
      - 'cmd/server/sqlite_runtime*.go'
      - 'cmd/server/main.go'
      - '.github/workflows/sqlite-metadata-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise persistence and cross-process policy contracts
        run: CGO_ENABLED=1 go test -tags datafabric_sqlite ./internal/config -run '^TestSQLite(Metadata|Snapshot)' -count=1
      - name: Verify experimental snapshot command
        run: CGO_ENABLED=1 go test -tags datafabric_sqlite ./cmd/server -run '^TestSQLiteSnapshot' -count=1
      - name: Verify standard metadata and authorization contracts
        run: go test ./internal/model ./internal/repository ./internal/security ./internal/mcp ./cmd/server
      - name: Verify disabled CGO fails closed
        run: CGO_ENABLED=0 go test -tags datafabric_sqlite ./internal/config -run '^TestSQLiteMetadataRequiresOptInBuild$' -count=1
      - name: Compile experimental source candidate
        run: CGO_ENABLED=1 go build -tags datafabric_sqlite,datafabric_core -o "$RUNNER_TEMP/data-fabric" ./cmd/server

  sqlite-runtime-acceptance:
    name: Experimental SQLite REST and MCP runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: df_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: df_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U df_fixture -d df_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned SQL parser in the isolated runner
        run: python -m pip install --requirement requirements-sql-translation.txt --target "$RUNNER_TEMP/sqlglot"
      - name: Exercise REST and MCP across SQLite backup and restore
        env:
          DF_SQLITE_RUNTIME_ACCEPTANCE: github-ci
          DF_SQLITE_RUNTIME_PG_PORT: '5432'
          DF_SQLITE_RUNTIME_SQLGLOT: ${{ runner.temp }}/sqlglot
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -tags datafabric_sqlite ./cmd/server -run '^TestSQLiteRuntimeRESTMCPRestartAndRestore$' -count=1 -v | tee "$RUNNER_TEMP/sqlite-runtime-acceptance.log"
          grep -q '^--- PASS: TestSQLiteRuntimeRESTMCPRestartAndRestore ' "$RUNNER_TEMP/sqlite-runtime-acceptance.log"

  sqlite-image-acceptance:
    name: Experimental SQLite image and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: df_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: df_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U df_fixture -d df_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build SQLite and existing full gateway images
        run: |
          set -o pipefail
          docker build -f Dockerfile.sqlite --build-arg DATA_FABRIC_SOURCE_REVISION="$GITHUB_SHA" -t data-fabric:sqlite-ci .
          docker build --build-arg DATA_FABRIC_SOURCE_REVISION="$GITHUB_SHA" -t data-fabric:full-ci .
      - name: Verify default non-root user and named volume
        run: |
          set -euo pipefail
          volume="df-sqlite-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm -v "$volume:/var/lib/data-fabric" --entrypoint /bin/sh data-fabric:sqlite-ci -c             'test "$(id -u)" = 10001 && test "$(id -g)" = 10001 && touch /var/lib/data-fabric/probe'
      - name: Run real image REST, MCP and recovery acceptance
        env:
          DF_SQLITE_RUNTIME_ACCEPTANCE: github-ci
          DF_SQLITE_RUNTIME_PG_PORT: '5432'
          DF_SQLITE_RUNTIME_SQLGLOT: /opt/data-fabric/python
          DF_SQLITE_RUNTIME_IMAGE: data-fabric:sqlite-ci
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -tags datafabric_sqlite ./cmd/server -run '^TestSQLiteRuntimeRESTMCPRestartAndRestore$' -count=1 -v | tee "$RUNNER_TEMP/sqlite-image-acceptance.log"
          grep -q '^--- PASS: TestSQLiteRuntimeRESTMCPRestartAndRestore ' "$RUNNER_TEMP/sqlite-image-acceptance.log"
      - name: Test safe local initialization
        run: python3 -m unittest discover -s scripts/sqlite -p 'test_*.py'
      - name: Run Compose first-use and recovery acceptance
        env:
          DF_SQLITE_RUNTIME_ACCEPTANCE: github-ci
          DF_SQLITE_RUNTIME_PG_PORT: '5432'
          DF_SQLITE_RUNTIME_IMAGE: data-fabric:sqlite-ci
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -tags datafabric_sqlite ./cmd/server -run '^TestSQLiteComposeFirstUse$' -count=1 -v | tee "$RUNNER_TEMP/sqlite-compose-acceptance.log"
          grep -q '^--- PASS: TestSQLiteComposeFirstUse ' "$RUNNER_TEMP/sqlite-compose-acceptance.log"
      - name: Record image sizes
        run: |
          set -o pipefail
          echo "source: $GITHUB_SHA" > "$RUNNER_TEMP/sqlite-image-sizes.txt"
          echo "architecture: $(uname -m)" >> "$RUNNER_TEMP/sqlite-image-sizes.txt"
          docker image inspect data-fabric:full-ci data-fabric:sqlite-ci --format '{{.RepoTags}} {{.Id}} {{.Size}} bytes' | tee -a "$RUNNER_TEMP/sqlite-image-sizes.txt"
          for image in full sqlite; do
            printf '%s docker-save gzip bytes: ' "$image" | tee -a "$RUNNER_TEMP/sqlite-image-sizes.txt"
            docker save "data-fabric:$image-ci" | gzip -c | wc -c | tee -a "$RUNNER_TEMP/sqlite-image-sizes.txt"
          done
      - name: Save image evidence
        uses: actions/upload-artifact@v4
        with:
          name: experimental-sqlite-image
          path: |
            ${{ runner.temp }}/sqlite-image-acceptance.log
            ${{ runner.temp }}/sqlite-compose-acceptance.log
            ${{ runner.temp }}/sqlite-image-sizes.txt
