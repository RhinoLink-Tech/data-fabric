    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SQL translation dependency
        run: python -m pip install --requirement requirements-sql-translation.txt

      - name: Install OpenAPI validator
        run: python -m pip install --requirement requirements-api-validation.txt

      - name: Install Agent Skills validator
        run: python -m pip install --requirement requirements-agent-skills.txt

      - name: Install DeepSeek example dependencies
        run: python -m pip install --requirement examples/deepseek-agent/requirements.txt

      - name: Validate Agent Skill
        run: skills-ref validate skills/data-fabric-query

      - name: Validate OpenAPI contract
        run: openapi-spec-validator specs/001-phase1-enhanced-single-source/contracts/openapi.yaml

      - name: Test DeepSeek function-calling bridge
        run: python -m unittest discover -s examples/deepseek-agent -p "test_*.py"

      - name: Run SQL translation regression tests
        run: python -m unittest discover -s scripts -p "test_sql_translate.py"

      - name: Test source archive checksum portability
        run: python -m unittest discover -s scripts/release -p "test_*.py"

      - name: Test contract result summary
        run: python -m unittest discover -s scripts/validation -p "test_summarize_driver_contracts.py"

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.go')
          else
            mapfile -t files < <(git ls-files '*.go')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            unformatted="$(gofmt -l "${files[@]}")"
            if [ -n "$unformatted" ]; then
              printf 'Go files need gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Verify PostgreSQL TLS certificate contract
        run: |
          set -o pipefail
          bash scripts/contracts/run_postgresql_tls_contract.sh 2>&1 | tee "$RUNNER_TEMP/postgres-tls.log"

      - name: Require the full profile PostgreSQL TLS result
        if: always()
        run: python3 scripts/ci/contract_checks.py require --job postgres-tls-contract --log "$RUNNER_TEMP/postgres-tls.log"

      - name: Run tests
        run: |
          result_file="$RUNNER_TEMP/go-test.json"
          set +e
          go test -count=1 -json ./... >"$result_file"
          test_status=$?
          python scripts/validation/summarize_driver_contracts.py "$result_file" --require-configured
          summary_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            cat "$result_file"
            exit "$test_status"
          fi
          exit "$summary_status"

      - name: Run race-enabled core tests
        run: go test -race ./internal/database ./internal/service

      - name: Build all packages
        run: go build ./...

      - name: Build public Makefile target
        run: make build

      - name: Build container image
        run: docker build --tag data-fabric:ci .

      - name: Smoke test SQL translation in the final image
        run: bash scripts/release/smoke_sql_translation_image.sh data-fabric:ci

      - name: Verify the image includes Go dependency license materials
        run: |
          docker run --rm --entrypoint /usr/bin/python3 data-fabric:ci -c 'import json; d=json.load(open("/app/third-party-licenses/go/MANIFEST.json")); assert d["SchemaVersion"] == 1 and len(d["Modules"]) > 0; print("Go license materials verified")'

      - name: Smoke test container user and entrypoint
        shell: bash
        run: |
          docker image inspect --format '{{.Config.User}}' data-fabric:ci > /tmp/data-fabric-container-user.txt
          grep -qx '10001:10001' /tmp/data-fabric-container-user.txt
          docker run --rm --entrypoint /bin/sh data-fabric:ci -c 'id -u | grep -qx 10001 && test -x /app/main && test -r /app/configs/config.yaml.example'
          if docker run --rm -e SERVER_PORT=0 data-fabric:ci >/tmp/data-fabric-container-smoke.log 2>&1; then
            echo "container entrypoint unexpectedly accepted an invalid port"
            exit 1
          fi
          grep -q 'Invalid startup configuration: server.port' /tmp/data-fabric-container-smoke.log
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          chmod 755 "$config_dir"
          touch "$config_dir"/mount-smoke
          docker run --rm --entrypoint /bin/sh -v "$config_dir:/app/configs:ro" data-fabric:ci -c "test -r /app/configs/mount-smoke"

