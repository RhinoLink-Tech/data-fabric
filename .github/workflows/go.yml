          go-version-file: go.mod
          cache: true

      - name: Run existing PostgreSQL TLS contract
        run: |
          set -o pipefail
          bash scripts/contracts/run_postgresql_tls_contract.sh 2>&1 | tee "$RUNNER_TEMP/live-contract.log"

      - name: Require the PostgreSQL TLS result
        if: always()
        run: python3 scripts/ci/contract_checks.py require --job postgres-tls-contract --log "$RUNNER_TEMP/live-contract.log"

