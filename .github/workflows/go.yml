name: Go CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # 02:17 China Standard Time; full provider/version matrix runs once daily.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-selection:
    name: Select affected live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected_jobs: ${{ steps.plan.outputs.selected_jobs }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select contracts from the complete Git diff
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/ci/contract_checks.py select
          --event "$CI_EVENT_NAME" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"

  reference-contracts:
    name: Reference PostgreSQL and MySQL contracts
    needs: contract-selection
    if: ${{ contains(fromJSON(needs.contract-selection.outputs.selected_jobs || '[]'), 'reference-contracts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_FABRIC_POSTGRES_CONTRACT_DSN: postgres://data_fabric_contract:contract-test-only@localhost:5432/data_fabric_contract?sslmode=disable
      DATA_FABRIC_POSTGRES_EXPECTED_VERSION: "17.11"
      DATA_FABRIC_MYSQL_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_MYSQL_CONTRACT_PORT: "3306"
      DATA_FABRIC_MYSQL_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_MYSQL_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_MYSQL_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_MYSQL_EXPECTED_VERSION: "8.4.13"
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: data_fabric_contract
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: data_fabric_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_fabric_contract -d data_fabric_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: root-contract-only
          MYSQL_USER: data_fabric_contract
          MYSQL_PASSWORD: contract-test-only
          MYSQL_DATABASE: data_fabric_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-contract-only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run both existing reference driver contracts
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/database/drivers/traditional -run '^(TestPostgreSQLDriverContract|TestMySQLDriverContract)$' 2>&1 | tee "$RUNNER_TEMP/live-contract.log"

      - name: Verify PostgreSQL MCP schema discovery
        env:
          DATA_FABRIC_POSTGRES_SCHEMA_TEST_DSN: ${{ env.DATA_FABRIC_POSTGRES_CONTRACT_DSN }}
        run: go test -count=1 -v ./internal/mcp -run '^TestPostgresListAndDescribeConfiguredSchemaContract$'

      - name: Require both reference contracts to run and pass
        if: always()
        run: python3 scripts/ci/contract_checks.py require --job reference-contracts --log "$RUNNER_TEMP/live-contract.log"

  public-reference-acceptance:
    name: Public REST and MCP reference acceptance
    needs: contract-selection
    if: ${{ contains(fromJSON(needs.contract-selection.outputs.selected_jobs || '[]'), 'public-reference-acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build one gateway image for both acceptance runs
        run: |
          docker build --tag data-fabric:public-acceptance --file Dockerfile \
            --build-arg DATA_FABRIC_VERSION=ci \
            --build-arg "DATA_FABRIC_SOURCE_REVISION=$GITHUB_SHA" .
          echo "acceptance_image_id=$(docker image inspect --format '{{.Id}}' data-fabric:public-acceptance)"

      - name: Run standalone public reference acceptance
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          acceptance_args=()
          if [[ "$CI_EVENT_NAME" != schedule && "$CI_EVENT_NAME" != workflow_dispatch ]]; then
            acceptance_args+=(-smoke)
          fi
          echo "acceptance_path=standalone"
          go run ./deploy/mcp/reference/cmd/acceptance -image data-fabric:public-acceptance "${acceptance_args[@]}" | tee "$RUNNER_TEMP/public-reference.log"

      - name: Run containerized two-replica acceptance against the same image
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          acceptance_args=()
          if [[ "$CI_EVENT_NAME" != schedule && "$CI_EVENT_NAME" != workflow_dispatch ]]; then
            acceptance_args+=(-smoke)
          fi
          acceptance_args+=(-multi-replica)
          echo "acceptance_path=two-replica"
          go run ./deploy/mcp/reference/cmd/acceptance -image data-fabric:public-acceptance "${acceptance_args[@]}" | tee -a "$RUNNER_TEMP/public-reference.log"

      - name: Set up Node.js for browser acceptance
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Exercise the candidate image's embedded UI
        working-directory: deploy/mcp
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: df-ui-ci-${{ github.run_id }}-${{ github.run_attempt }}
          DATA_FABRIC_IMAGE: data-fabric:public-acceptance
          MCP_OIDC_ISSUER: https://issuer.example.invalid
          MCP_OIDC_AUDIENCE: ui-acceptance
        run: |
          set -euo pipefail
          cleanup() { docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml down --volumes --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python3 ../../scripts/mcp/onboard.py init
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml up --no-build -d metadata-db sample-source data-fabric-api
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          for _ in range(120):
              try:
                  with urlopen('http://127.0.0.1:8080/health', timeout=2) as response:
                      if response.status == 200:
                          health = json.load(response)
                          if health.get('version') != 'ci' or health.get('source_revision') != os.environ['GITHUB_SHA']:
                              raise SystemExit('Candidate health identity does not match its build inputs')
                          print('Candidate health identity matches image build inputs.')
                          break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('Candidate API did not become healthy')
          PY
          export DF_UI_BROWSER="$(command -v google-chrome || command -v chromium)"
          export DF_UI_BEARER_TOKEN="$(python3 ../../scripts/mcp/onboard.py token --user ui-release-acceptance --tenant quickstart)"
          export DF_UI_SAMPLE_PASSWORD="$(python3 -c 'import sys; sys.path.insert(0, "../../scripts/mcp"); import onboard; print(onboard.parse_env(__import__("pathlib").Path(".env"))["SAMPLE_READER_PASSWORD"])')"
          node ../../scripts/mcp/ui-release-acceptance.mjs 2>&1 | tee -a "$RUNNER_TEMP/public-reference.log"

      - name: Upload public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-reference-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/public-reference.log
          if-no-files-found: warn
          retention-days: 14

  postgres-tls-contract:
    name: PostgreSQL TLS certificate contract
    needs: contract-selection
    if: ${{ contains(fromJSON(needs.contract-selection.outputs.selected_jobs || '[]'), 'postgres-tls-contract') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
