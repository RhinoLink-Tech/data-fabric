name: Go CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    env:
      DATA_FABRIC_POSTGRES_CONTRACT_DSN: postgres://data_fabric_contract:contract-test-only@localhost:5432/data_fabric_contract?sslmode=disable
      DATA_FABRIC_POSTGRES_EXPECTED_VERSION: "17.11"
      DATA_FABRIC_MYSQL_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_MYSQL_CONTRACT_PORT: "3306"
      DATA_FABRIC_MYSQL_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_MYSQL_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_MYSQL_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_MYSQL_EXPECTED_VERSION: "8.0.46"
      DATA_FABRIC_MARIADB_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_MARIADB_CONTRACT_PORT: "3307"
      DATA_FABRIC_MARIADB_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_MARIADB_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_MARIADB_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_MARIADB_EXPECTED_VERSION: "11.8.9"
      DATA_FABRIC_CLICKHOUSE_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_CLICKHOUSE_CONTRACT_PORT: "9000"
      DATA_FABRIC_CLICKHOUSE_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_CLICKHOUSE_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_CLICKHOUSE_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_CLICKHOUSE_EXPECTED_VERSION: "26.8.20.9"
      DATA_FABRIC_TIDB_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_TIDB_CONTRACT_PORT: "4000"
      DATA_FABRIC_TIDB_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_TIDB_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_TIDB_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_TIDB_EXPECTED_VERSION: "8.0.11-TiDB-v8.5.8"
      DATA_FABRIC_OPENGAUSS_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_OPENGAUSS_CONTRACT_PORT: "5433"
      DATA_FABRIC_OPENGAUSS_CONTRACT_USERNAME: gaussdb
      DATA_FABRIC_OPENGAUSS_CONTRACT_PASSWORD: "DataFabric_2026!"
      DATA_FABRIC_OPENGAUSS_CONTRACT_DATABASE: postgres
      DATA_FABRIC_OPENGAUSS_EXPECTED_VERSION: "openGauss 6.0.0 build aee4abd5"
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: data_fabric_contract
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: data_fabric_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_fabric_contract -d data_fabric_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root-contract-only
          MYSQL_USER: data_fabric_contract
          MYSQL_PASSWORD: contract-test-only
          MYSQL_DATABASE: data_fabric_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-contract-only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
        env:
          MARIADB_ROOT_PASSWORD: root-contract-only
          MARIADB_USER: data_fabric_contract
          MARIADB_PASSWORD: contract-test-only
          MARIADB_DATABASE: data_fabric_contract
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -proot-contract-only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.20.9-alpine@sha256:1e67397fa4828e8dbb95b3bcc37a8822749ca5e46bd208b3ef336f365c522688
        env:
          CLICKHOUSE_DB: data_fabric_contract
          CLICKHOUSE_USER: data_fabric_contract
          CLICKHOUSE_PASSWORD: contract-test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --host 127.0.0.1 --user data_fabric_contract --password contract-test-only --database data_fabric_contract --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      tidb:
        image: pingcap/tidb:v8.5.8@sha256:df168c764bf2dfdb166dc37a5c3b0e210d29d5f3ab2d33317fd0fdf7b32037f5
        ports:
          - 4000:4000
          - 10080:10080
        options: >-
          --health-cmd "curl --fail --silent --output /dev/null http://127.0.0.1:10080/status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      opengauss:
        image: enmotech/opengauss:6.0.0@sha256:9bd81380273944e5a02a2139c90954d4f46813b71810f7b23fe8f738014d03b5
        env:
          GS_PASSWORD: "DataFabric_2026!"
        ports:
          - 5433:5432
        options: >-
          --privileged=true
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5432'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SQL translation dependency
        run: python -m pip install --requirement requirements-sql-translation.txt

      - name: Install OpenAPI validator
        run: python -m pip install --requirement requirements-api-validation.txt

      - name: Install Agent Skills validator
        run: python -m pip install --requirement requirements-agent-skills.txt

      - name: Validate Agent Skill
        run: skills-ref validate skills/data-fabric-query

      - name: Validate OpenAPI contract
        run: openapi-spec-validator specs/001-phase1-enhanced-single-source/contracts/openapi.yaml

      - name: Run SQL translation regression tests
        run: python -m unittest discover -s scripts -p "test_sql_translate.py"

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.go')
          else
            mapfile -t files < <(git ls-files '*.go')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            unformatted="$(gofmt -l "${files[@]}")"
            if [ -n "$unformatted" ]; then
              printf 'Go files need gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race-enabled core tests
        run: go test -race ./internal/database ./internal/service

      - name: Build all packages
        run: go build ./...

      - name: Build public Makefile target
        run: make build

      - name: Build container image
        run: docker build --tag data-fabric:ci .

      - name: Smoke test SQL translation in the final image
        run: bash scripts/release/smoke_sql_translation_image.sh data-fabric:ci

      - name: Smoke test container user and entrypoint
        shell: bash
        run: |
          docker image inspect --format '{{.Config.User}}' data-fabric:ci > /tmp/data-fabric-container-user.txt
          grep -qx '10001:10001' /tmp/data-fabric-container-user.txt
          docker run --rm --entrypoint /bin/sh data-fabric:ci -c 'id -u | grep -qx 10001 && test -x /app/main && test -r /app/configs/config.yaml.example'
          if docker run --rm -e SERVER_PORT=0 data-fabric:ci >/tmp/data-fabric-container-smoke.log 2>&1; then
            echo "container entrypoint unexpectedly accepted an invalid port"
            exit 1
          fi
          grep -q 'Invalid startup configuration: server.port' /tmp/data-fabric-container-smoke.log
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          chmod 755 "$config_dir"
          touch "$config_dir"/mount-smoke
          docker run --rm --entrypoint /bin/sh -v "$config_dir:/app/configs:ro" data-fabric:ci -c "test -r /app/configs/mount-smoke"

  sqlserver-contract:
    name: SQL Server driver contract
    runs-on: ubuntu-latest
    env:
      DATA_FABRIC_SQLSERVER_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_SQLSERVER_CONTRACT_PORT: "1433"
      DATA_FABRIC_SQLSERVER_CONTRACT_USERNAME: sa
      DATA_FABRIC_SQLSERVER_CONTRACT_PASSWORD: "DataFabric_2026!"
      DATA_FABRIC_SQLSERVER_CONTRACT_DATABASE: master
      DATA_FABRIC_SQLSERVER_EXPECTED_VERSION: "16.0.4305.5"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DataFabric_2026!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 60s
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQL Server driver contract
        run: go test ./internal/database/drivers/traditional -run '^TestSQLServerDriverContract$' -count=1 -v

  mongodb-contract:
    name: MongoDB driver contract
    # MongoDB 8.0.34 cannot start on Linux kernels 6.19+; keep this contract on the Ubuntu 22.04 runner.
    runs-on: ubuntu-22.04
    env:
      DATA_FABRIC_MONGODB_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_MONGODB_CONTRACT_PORT: "27017"
      DATA_FABRIC_MONGODB_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_MONGODB_CONTRACT_PASSWORD: contract-test-only
      DATA_FABRIC_MONGODB_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_MONGODB_BOOTSTRAP_USERNAME: contract_admin
      DATA_FABRIC_MONGODB_BOOTSTRAP_PASSWORD: root-contract-only
      DATA_FABRIC_MONGODB_EXPECTED_VERSION: "8.0.34"
    services:
      mongodb:
        image: mongo:8.0.34-noble@sha256:c2d54fddfb3738fb27fe117f51692e3f44e640a3e7aeb8da3937ee9cd33a650b
        env:
          MONGO_INITDB_ROOT_USERNAME: contract_admin
          MONGO_INITDB_ROOT_PASSWORD: root-contract-only
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username contract_admin --password root-contract-only --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MongoDB driver contract
        run: go test ./internal/database/drivers/nosql -run '^TestMongoDriverContract$' -count=1 -v

  oracle-contract:
