    runs-on: ubuntu-latest
    env:
      DATA_FABRIC_ORACLE_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_ORACLE_CONTRACT_PORT: "1521"
      DATA_FABRIC_ORACLE_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_ORACLE_CONTRACT_PASSWORD: Contract2026Test
      DATA_FABRIC_ORACLE_CONTRACT_SERVICE: FREEPDB1
      DATA_FABRIC_ORACLE_ADMIN_USERNAME: system
      DATA_FABRIC_ORACLE_ADMIN_PASSWORD: Contract2026Admin
      DATA_FABRIC_ORACLE_EXPECTED_VERSION: "23.26.3.0.0"
    services:
      oracle:
        image: ghcr.io/gvenzl/oracle-free:23.26.3-slim@sha256:366fe85702d764d81a0272b72e94e629290c27aa72a47825fcc45701a0633dac
        env:
          ORACLE_PASSWORD: Contract2026Admin
          APP_USER: data_fabric_contract
          APP_USER_PASSWORD: Contract2026Test
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 60s
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Oracle driver contract
        run: go test ./internal/database/drivers/traditional -run '^TestOracleDriverContract$' -count=1 -v

  s3-csv-contract:
    name: S3 CSV driver contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run S3-compatible service contract
        run: bash scripts/contracts/run_s3_csv_contract.sh

  minio-csv-contract:
    name: MinIO CSV driver contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MinIO CSV contract
        run: bash scripts/contracts/run_minio_csv_contract.sh

  doris-contract:
    name: Apache Doris driver contract
    runs-on: ubuntu-latest
    env:
      DATA_FABRIC_DORIS_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_DORIS_CONTRACT_PORT: "9030"
      DATA_FABRIC_DORIS_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_DORIS_CONTRACT_PASSWORD: "Contract2026Test!"
      DATA_FABRIC_DORIS_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_DORIS_EXPECTED_VERSION: doris-4.1.3
    services:
      doris:
        image: apache/doris:all-in-one-4.1.3@sha256:4d3aef8f4fe63f6e32b493b4fd7b2a682d19e2c800d1d812131e67aaba0d212a
        ports:
          - 9030:9030
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Apache Doris driver contract
        run: go test ./internal/database/drivers/olap -run '^TestDorisDriverContract$' -count=1 -v

      - name: Run Apache Doris metadata contract
        run: go test ./internal/database/metadata -run '^TestDorisMetadataExtractorContract$' -count=1 -v

  starrocks-contract:
    name: StarRocks driver and metadata contract
    runs-on: ubuntu-latest
    env:
      DATA_FABRIC_STARROCKS_CONTRACT_HOST: 127.0.0.1
      DATA_FABRIC_STARROCKS_CONTRACT_PORT: "9030"
      DATA_FABRIC_STARROCKS_CONTRACT_USERNAME: data_fabric_contract
      DATA_FABRIC_STARROCKS_CONTRACT_PASSWORD: "Contract2026Test!"
      DATA_FABRIC_STARROCKS_CONTRACT_DATABASE: data_fabric_contract
      DATA_FABRIC_STARROCKS_EXPECTED_VERSION: "4.1.6"
    services:
      starrocks:
        image: starrocks/allin1-ubuntu:4.1.6@sha256:88d1192620d03cf7ae8d5ece0b02da1024372d33bc411e5a51e2d3b003c551b3
        ports:
          - 9030:9030
        options: >-
          --health-interval 10s
          --health-timeout 15s
          --health-retries 30
          --health-start-period 90s
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run StarRocks driver contract
        run: go test ./internal/database/drivers/olap -run '^TestStarRocksDriverContract$' -count=1 -v

      - name: Run StarRocks metadata contract
        run: go test ./internal/database/metadata -run '^TestStarRocksMetadataExtractorContract$' -count=1 -v
