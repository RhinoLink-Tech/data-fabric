            image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    env:
      DATA_FABRIC_POSTGRES_CONTRACT_DSN: postgres://data_fabric_contract:contract-test-only@localhost:5432/data_fabric_contract?sslmode=disable
      DATA_FABRIC_POSTGRES_EXPECTED_VERSION: ${{ matrix.version }}
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: data_fabric_contract
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: data_fabric_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_fabric_contract -d data_fabric_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL driver contract
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/database/drivers/traditional -run '^TestPostgreSQLDriverContract$' 2>&1 | tee -a "$RUNNER_TEMP/live-contract.log"

      - name: Require actual live contract results
        if: always()
        run: python3 scripts/ci/contract_checks.py require --job postgres-version-contracts --log "$RUNNER_TEMP/live-contract.log"

