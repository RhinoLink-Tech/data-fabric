name: Candidate profile recovery acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Preview to recover with the current helper
        required: true
        default: v2.1.0-preview.3
        type: choice
        options:
          - v2.1.0-preview.2
          - v2.1.0-preview.3
  pull_request:
    paths:
      - 'deploy/mcp/reference/recovery_acceptance.go'
      - 'deploy/mcp/reference/cmd/recovery-acceptance/**'
      - 'scripts/mcp/recovery.py'
      - 'scripts/mcp/onboard.py'
      - 'deploy/mcp/docker-compose.yml'
      - 'deploy/mcp/docker-compose.recovery.yml'
      - '.github/workflows/recovery-acceptance.yml'

permissions:
  contents: read

jobs:
  recovery:
    name: Encrypted backup and fresh-volume recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Exercise documented profile with isolated synthetic OIDC
        shell: bash
        run: |
          set -o pipefail
          go run ./deploy/mcp/reference/cmd/recovery-acceptance | tee "$RUNNER_TEMP/recovery-acceptance.log"
      - name: Save non-secret evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-acceptance.log
          if-no-files-found: warn
          retention-days: 30

  published-preview:
    name: Published Preview archive and image recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Download the published source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v2.1.0-preview.3' }}
        run: |
          ARCHIVE="data-fabric-${RELEASE_TAG}-source.tar.gz"
          gh release download "$RELEASE_TAG" --repo RhinoLink-Tech/data-fabric --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
      - name: Rehearse published archive and image with current recovery helper
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v2.1.0-preview.3' }}
        shell: bash
        run: |
          set -o pipefail
          ARCHIVE="data-fabric-${RELEASE_TAG}-source.tar.gz"
          go run ./deploy/mcp/reference/cmd/recovery-acceptance -published-release "$RELEASE_TAG" -release-archive "$RUNNER_TEMP/$ARCHIVE" | tee "$RUNNER_TEMP/published-preview-recovery-acceptance.log"
      - name: Save non-secret evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-preview-recovery-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-preview-recovery-acceptance.log
          if-no-files-found: warn
          retention-days: 30
