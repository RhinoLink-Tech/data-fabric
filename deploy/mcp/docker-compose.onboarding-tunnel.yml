# WorkBuddy onboarding bridge: add after docker-compose.yml and the desired source overlay.
# Compose 2.24+ is required for !override. Isolate this metadata DB from legacy API instances.
services:
  data-fabric-api:
    profiles: [legacy-api]
  data-fabric-mcp:
    depends_on: !override
      metadata-db:
        condition: service_healthy
    environment:
      MCP_ADDRESS: 127.0.0.1:8081
      MCP_TLS_CERT_FILE: ""
      MCP_TLS_KEY_FILE: ""
      DATA_FABRIC_WORKBUDDY_ONBOARDING: "true"
      DATA_FABRIC_WORKBUDDY_BRIDGE: "true"
      DATA_FABRIC_WORKBUDDY_ORIGIN: ${DATA_FABRIC_WORKBUDDY_ORIGIN:?set HTTPS public origin}
      DATA_FABRIC_WORKBUDDY_OIDC_CLIENT_ID: ${DATA_FABRIC_WORKBUDDY_OIDC_CLIENT_ID:?set OIDC client ID}
      DATA_FABRIC_WORKBUDDY_OIDC_CLIENT_SECRET: ${DATA_FABRIC_WORKBUDDY_OIDC_CLIENT_SECRET:-}
      DATA_FABRIC_WORKBUDDY_OIDC_AUTH_URL: ${DATA_FABRIC_WORKBUDDY_OIDC_AUTH_URL:?set OIDC authorization URL}
      DATA_FABRIC_WORKBUDDY_OIDC_TOKEN_URL: ${DATA_FABRIC_WORKBUDDY_OIDC_TOKEN_URL:?set OIDC token URL}
      DATA_FABRIC_WORKBUDDY_ALLOWED_CIDRS: ${DATA_FABRIC_WORKBUDDY_ALLOWED_CIDRS:?set explicit source CIDRs}
      DATA_FABRIC_WORKBUDDY_ALLOWED_PORTS: ${DATA_FABRIC_WORKBUDDY_ALLOWED_PORTS:?set explicit source ports}
    ports: !override
      - "127.0.0.1:${MCP_HTTP_PORT:-18347}:8082"
