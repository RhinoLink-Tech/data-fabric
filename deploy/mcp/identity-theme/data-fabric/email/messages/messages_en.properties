# Data Fabric overrides for identity emails (#618). Chinese-first: the public
# realm runs with internationalization disabled (lang=en), so this bundle is
# what actually renders. Placeholders ({0}, {1}, ...) are inherited from the
# base templates and must be preserved exactly.
emailVerificationSubject=验证你的邮箱
emailVerificationBody=有人使用此邮箱地址注册了 {2} 账号。如果这是你本人操作，请点击下面的链接完成邮箱验证：\n\n{0}\n\n链接将在 {3} 内失效。\n\n如果这不是你本人操作，请忽略此邮件。
emailVerificationBodyHtml=<p>有人使用此邮箱地址注册了 <b>{2}</b> 账号。如果这是你本人操作，请点击下面的按钮完成邮箱验证：</p><p style="margin:24px 0;"><a href="{0}" style="display:inline-block;padding:11px 22px;background:#c96442;color:#ffffff;border-radius:10px;font-weight:600;text-decoration:none;">验证邮箱</a></p><p style="color:#6b6862;font-size:13px;">如果按钮无法点击，请将此链接复制到浏览器打开：{0}<br/>链接将在 {3} 内失效。</p><p>如果这不是你本人操作，请忽略此邮件。</p>
emailVerificationCodeSubject=验证你的邮箱
emailVerificationCodeBody=有人在 {2} 上请求了邮箱验证。你的验证码为：\n\n{0}\n\n验证码将在 {1} 内失效。如果这不是你本人操作，请忽略此邮件。
emailVerificationCodeBodyHtml=<p>有人在 <b>{2}</b> 上请求了邮箱验证，你的验证码为：</p><p style="font-size:24px;letter-spacing:6px;font-weight:600;color:#c96442;">{0}</p><p>验证码将在 {1} 内失效。如果这不是你本人操作，请忽略此邮件。</p>
emailUpdateConfirmationSubject=确认新的邮箱地址
emailUpdateConfirmationBody=要将你的 {2} 账号邮箱更新为 {1}，请点击下面的链接：\n\n{0}\n\n链接将在 {3} 内失效。\n\n如果这不是你本人操作，请忽略此邮件。
emailUpdateConfirmationBodyHtml=<p>要将你的 <b>{2}</b> 账号邮箱更新为 <b>{1}</b>，请点击下面的链接：</p><p style="margin:24px 0;"><a href="{0}" style="display:inline-block;padding:11px 22px;background:#c96442;color:#ffffff;border-radius:10px;font-weight:600;text-decoration:none;">确认邮箱更新</a></p><p style="color:#6b6862;font-size:13px;">如果按钮无法点击，请将此链接复制到浏览器打开：{0}<br/>链接将在 {3} 内失效。</p><p>如果这不是你本人操作，请忽略此邮件。</p>
passwordResetSubject=重置你的密码
