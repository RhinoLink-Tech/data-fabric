# Data Fabric identity email theme (#618).
#
# parent=base keeps every email template (verification, verification-with-code,
# update confirmation, password reset, execute actions, events) and the text
# variants; this theme overrides only the HTML layout and the English message
# bundle (the public realm runs with internationalization disabled, so
# messages_en.properties is what renders), giving the emails the Data Fabric
# look and Chinese copy.
parent=base
