# Data Fabric identity login theme (#618).
#
# parent=base is deliberate: the "keycloak"/"keycloak.v2" themes define their
# own kc* classes and pull PatternFly; extending base leaves this theme a clean
# slate where every class below is defined here and styled by css/df.css.
# Base still supplies all other page templates (reset credentials, required
# action, error pages), the shared JS (authChecker, menu-button-links), and
# this theme overrides the two pages users see most: login and registration.
parent=base

# The single stylesheet linked by base template.ftl for every login page.
styles=css/df.css

# Class wiring for base template.ftl and the overridden pages. Base renders
# `${properties.kcXxxClass!}`, so every value here is a df-* class defined in
# css/df.css. Classes left undefined in base (password visibility icons,
# patternfly wrappers) are simply not used.
kcLoginClass=df-login
kcHeaderClass=df-header
kcHeaderWrapperClass=df-header-wrapper
kcFormCardClass=df-card
kcFormHeaderClass=df-card-header
kcFormClass=df-form
kcFormGroupClass=df-group
kcLabelClass=df-label
kcInputClass=df-input
kcInputErrorMessageClass=df-input-error
kcFormSettingClass=df-row
kcFormOptionsWrapperClass=df-right
kcInfoAreaWrapperClass=df-info
kcAlertClass=df-alert
kcAlertTitleClass=df-alert-text
kcButtonClass=df-btn
kcButtonPrimaryClass=df-btn-primary
kcButtonBlockClass=df-btn-block
kcFormSocialAccountSectionClass=df-social
kcFormSocialAccountListClass=df-social-list
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=df-social-btn
kcFormSocialAccountListButtonDisabledClass=df-social-btn-disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=df-social-name
kcCommonLogoIdP=
