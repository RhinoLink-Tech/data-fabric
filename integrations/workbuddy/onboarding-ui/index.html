<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>连接数据源 - Data Fabric</title><link rel="stylesheet" href="/onboarding/assets/onboarding.css"><script defer src="/onboarding/assets/onboarding.js"></script></head>
<body><main><header><p>DATA FABRIC</p><h1>连接数据源</h1><p>在当前页面安全填写连接信息，完成后返回 WorkBuddy 查询和管理。</p></header><section id="loading" role="status">正在检查登录状态…</section><section id="error" role="alert" hidden></section><a id="login" hidden>登录 Data Fabric</a><section id="success" role="status" hidden></section><form id="form" hidden novalidate><small id="update-tls-note" hidden>更新时默认保留现有 TLS 设置；如要调整，请明确选择。为保护已加密连接，本向导不允许改为明文。</small><label>数据源名称<input name="name" required maxlength="255" autocomplete="off" placeholder="例如：业务订单库"></label><label>数据源类型<select name="type" required><option value="">请选择数据源类型</option></select></label><label>主机或端点<input name="host" autocomplete="off" placeholder="例如：db.example.com"></label><small>不要在主机或地址中填写用户名、密码、查询参数或片段。密码请填写在专用输入框中。</small><label>端口<input name="port" type="number" inputmode="numeric" min="1" max="65535"></label><label>数据库 / 路径<input name="database" autocomplete="off"></label><label>Schema<input name="schema" autocomplete="off"></label><label>用户名<input name="username" autocomplete="off"></label><label>密码或凭据<input name="password" type="password" autocomplete="new-password" spellcheck="false"></label><small>此向导当前仅支持无 TLS 连接，用户名与数据库名限字母、数字及 . _ ~ -；密码可包含符号和中文。为固定允许的网络目标，服务会保存解析后的 IP 地址。</small><div id="result" role="status" aria-live="polite"></div><div class="actions"><button id="test" type="button">测试连接</button><button id="save" type="submit">保存数据源</button></div><small>连接信息直接提交到你的 Data Fabric 服务，不需要在聊天中发送密码。</small></form></main></body></html>
